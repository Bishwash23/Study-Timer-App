<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Study Timer</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2a2f3a;
    --text:#e9ecf1; --muted:#8b929e; --accent:#5b8cff; --danger:#e5484d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; display:flex; flex-direction:column; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  .tabs{display:flex; gap:4px; padding:10px 12px 0; flex:0 0 auto;}
  .tabs button{
    flex:1; padding:8px 0; border:0; border-radius:8px 8px 0 0;
    background:transparent; color:var(--muted); font:600 13px/1 inherit; cursor:pointer;
  }
  .tabs button.active{background:var(--panel); color:var(--text);}
  main{flex:1; overflow-y:auto; padding:18px;}
  section[hidden]{display:none;}

  .seg{display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:10px;}
  .seg button{
    flex:1; padding:8px 0; border:0; border-radius:7px; background:transparent;
    color:var(--muted); font:600 13px/1 inherit; cursor:pointer;
  }
  .seg button.active{background:var(--panel2); color:var(--text);}

  .phase{margin:22px 0 4px; text-align:center; color:var(--muted);
         font:600 12px/1 inherit; letter-spacing:.08em; text-transform:uppercase;}
  .clock{text-align:center; font-size:64px; font-weight:300;
         font-variant-numeric:tabular-nums; letter-spacing:-2px;}
  .progress{height:6px; background:var(--panel2); border-radius:99px; margin:14px 0 22px; overflow:hidden;}
  .progress > div{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .2s linear;}

  .controls{display:flex; gap:10px;}
  .controls button{
    flex:1; padding:13px 0; border:0; border-radius:10px; cursor:pointer;
    background:var(--panel2); color:var(--text); font:600 14px/1 inherit;
  }
  .controls button.primary{background:var(--accent); color:#fff;}
  .controls button:hover{filter:brightness(1.1);}

  .today{margin-top:20px; text-align:center; color:var(--muted); font-size:13px;}
  .today b{color:var(--text); font-size:15px;}

  .notify-hint{text-align:center; font-size:12px; color:var(--muted);
               margin-top:14px; line-height:1.5;}
  .notify-hint .btn{margin-top:8px;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .card{background:var(--panel); border-radius:12px; padding:14px;}
  .card .k{color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase;}
  .card .v{font-size:22px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums;}

  h3{margin:22px 0 10px; font-size:12px; letter-spacing:.08em;
     text-transform:uppercase; color:var(--muted);}

  .chart{display:flex; gap:8px; height:140px;}
  .day{flex:1; display:flex; flex-direction:column;}
  .day-bar{flex:1; display:flex; align-items:flex-end; background:var(--panel2);
           border-radius:5px; overflow:hidden;}
  .fill{width:100%; background:var(--accent); border-radius:5px; min-height:2px; transition:height .3s;}
  .day-label{text-align:center; font-size:10px; color:var(--muted); margin-top:6px;}

  .list{background:var(--panel); border-radius:12px; overflow:hidden;}
  .row{display:flex; align-items:center; gap:10px; padding:10px 12px;
       border-bottom:1px solid var(--line); font-size:12px;}
  .row:last-child{border-bottom:0;}
  .row .t{flex:1; color:var(--muted);}
  .row .d{font-variant-numeric:tabular-nums;}
  .row button{border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:14px;}
  .row button:hover{color:var(--danger);}
  .muted{color:var(--muted); font-size:13px; padding:14px;}

  .setting{display:flex; align-items:center; justify-content:space-between;
           padding:11px 12px; background:var(--panel); border-bottom:1px solid var(--line);}
  .setting.top{border-radius:12px 12px 0 0;}
  .setting.bottom{border-radius:0 0 12px 12px; border-bottom:0;}
  .setting.solo{border-radius:12px; border-bottom:0;}
  .setting label{font-size:13px;}
  .setting input[type=number]{width:70px; padding:6px 8px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); font:inherit; text-align:center;}
  .setting input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}

  .btnrow{display:flex; gap:8px;}
  .btn{border:0; border-radius:9px; padding:8px 14px; cursor:pointer;
       background:var(--panel2); color:var(--text); font:600 13px/1 inherit;}
  .btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>

<div class="tabs">
  <button data-tab="timer" class="active">Timer</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="settings">Settings</button>
</div>

<main>
  <!-- ================= TIMER ================= -->
  <section id="tab-timer">
    <div class="seg" id="modeSwitch">
      <button data-mode="pomodoro" class="active">Pomodoro</button>
      <button data-mode="stopwatch">Stopwatch</button>
    </div>

    <div class="phase" id="phaseLabel">Focus</div>
    <div class="clock" id="clock">25:00</div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="controls">
      <button id="btnStart" class="primary">Start</button>
      <button id="btnReset">Reset</button>
    </div>

    <div class="today">Today&nbsp; <b id="todayTotal">0m</b></div>

    <div id="notifyHint" class="notify-hint" hidden></div>
  </section>

  <!-- ================= STATS ================= -->
  <section id="tab-stats" hidden>
    <div class="grid">
      <div class="card"><div class="k">Today</div><div class="v" id="statDay">0m</div></div>
      <div class="card"><div class="k">This week</div><div class="v" id="statWeek">0m</div></div>
      <div class="card"><div class="k">This month</div><div class="v" id="statMonth">0m</div></div>
      <div class="card"><div class="k">This year</div><div class="v" id="statYear">0m</div></div>
    </div>

    <h3>Last 7 days</h3>
    <div class="chart" id="chart"></div>

    <h3>Recent sessions</h3>
    <div class="list" id="recentList"></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="tab-settings" hidden>
    <div class="setting top">
      <label>Focus length (min)</label>
      <input type="number" min="1" max="180" data-setting="focusMin" />
    </div>
    <div class="setting">
      <label>Short break (min)</label>
      <input type="number" min="1" max="60" data-setting="breakMin" />
    </div>
    <div class="setting">
      <label>Long break (min)</label>
      <input type="number" min="1" max="120" data-setting="longBreakMin" />
    </div>
    <div class="setting">
      <label>Long break every N focus blocks</label>
      <input type="number" min="2" max="12" data-setting="longBreakEvery" />
    </div>
    <div class="setting">
      <label>Auto-start break</label>
      <input type="checkbox" data-setting="autoStartBreak" />
    </div>
    <div class="setting">
      <label>Auto-start next focus</label>
      <input type="checkbox" data-setting="autoStartFocus" />
    </div>
    <div class="setting bottom">
      <label>Sound on phase end</label>
      <input type="checkbox" data-setting="soundOn" />
    </div>

    <h3>Data</h3>
    <div class="setting solo">
      <label>Backup</label>
      <div class="btnrow">
        <button class="btn" id="btnExport">Export</button>
        <button class="btn" id="btnImport">Import</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden />
    <p class="muted" id="dataMsg" style="padding:12px 2px 0"></p>

    <p class="muted" style="padding:16px 2px 0">
      Changing a length restarts the current timer.
    </p>
  </section>
</main>

<script>
'use strict';

/* Shorthand DOM lookup (used everywhere below). */
const $ = id => document.getElementById(id);

/* crypto.randomUUID polyfill for strict webviews / older engines. */
if (!crypto.randomUUID) {
  crypto.randomUUID = () =>
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

/* =========================================================
   Persistence
   ========================================================= */
const K_SESSIONS = 'study.sessions.v1';
const K_SETTINGS = 'study.settings.v1';

const readJSON = (k, fb) => {
  try { const r = localStorage.getItem(k); return r === null ? fb : JSON.parse(r); }
  catch { return fb; }
};
const writeJSON = (k, v) => localStorage.setItem(k, JSON.stringify(v));

const DEFAULT_SETTINGS = {
  focusMin: 25, breakMin: 5, longBreakMin: 15,
  longBreakEvery: 4, autoStartBreak: true, autoStartFocus: false,
  soundOn: true,
};

let sessions = readJSON(K_SESSIONS, []);
let settings = { ...DEFAULT_SETTINGS, ...readJSON(K_SETTINGS, {}) };

/* =========================================================
   Timer state
   A "block" = one contiguous stretch of actually-running time.
   Pausing flushes the block to storage, so pauses never inflate
   the totals and a block can never span across a pause.
   ========================================================= */
const timer = {
  mode: 'pomodoro',     // 'pomodoro' | 'stopwatch'
  phase: 'focus',       // 'focus' | 'break' | 'longBreak'
  status: 'idle',       // 'idle' | 'running' | 'paused'
  phaseElapsed: 0,      // ms already spent in this phase (from earlier blocks)
  blockStart: null,     // epoch ms when the current running block began
  focusCount: 0,        // completed focus blocks, for long-break cadence
};

const liveElapsed = () =>
  timer.phaseElapsed + (timer.blockStart ? Date.now() - timer.blockStart : 0);

function phaseDurationMs() {
  if (timer.mode === 'stopwatch') return 0;
  if (timer.phase === 'focus') return settings.focusMin * 60000;
  if (timer.phase === 'longBreak') return settings.longBreakMin * 60000;
  return settings.breakMin * 60000;
}

/* =========================================================
   Session storage
   ========================================================= */
function addSession(start, end, mode) {
  if (end - start < 1000) return;            // ignore sub-second blips
  sessions.push({ id: crypto.randomUUID(), start, end, mode });
  sessions.sort((a, b) => a.start - b.start);
  writeJSON(K_SESSIONS, sessions);
}

function flushBlock() {
  if (timer.blockStart === null) return;
  const end = Date.now();
  if (timer.phase === 'focus') addSession(timer.blockStart, end, timer.mode);
  timer.phaseElapsed += end - timer.blockStart;
  timer.blockStart = null;
}

/* =========================================================
   Browser notifications
   ========================================================= */
const notifySupported = 'Notification' in window;
let phaseTimer = null;                       // exact phase-end timeout

function updateNotifyUI() {
  const el = $('notifyHint');
  if (!el) return;

  if (!notifySupported) {
    el.hidden = false;
    el.textContent = 'Notifications are not supported in this browser.';
    return;
  }

  const p = Notification.permission;
  if (p === 'granted') {
    el.hidden = true;
    el.innerHTML = '';
  } else if (p === 'denied') {
    el.hidden = false;
    el.innerHTML =
      'Notifications are blocked. Allow them for this site in your browser settings to get alerts.';
  } else {
    el.hidden = false;
    el.innerHTML =
      'Enable browser notifications to be alerted when a phase ends.<br>' +
      '<button class="btn" id="btnEnableNotify">Enable notifications</button>';
    const b = document.getElementById('btnEnableNotify');
    if (b) b.addEventListener('click', () => requestNotify(true));
  }
}

async function requestNotify(force) {
  if (!notifySupported) return 'unsupported';
  if (Notification.permission === 'granted') return 'granted';
  if (Notification.permission === 'denied')  return 'denied';
  // Without a user gesture, Chrome silently ignores the prompt.
  // `force` is only true from a click handler.
  if (!force && !navigator.userActivation?.isActive) return 'default';

  try {
    const p = await Notification.requestPermission();
    updateNotifyUI();
    return p;
  } catch {
    return 'default';
  }
}

function fireNotify(title, body) {
  if (!notifySupported || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {
      body,
      tag: 'study-timer',
      renotify: true,
    });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => { try { n.close(); } catch {} }, 8000);
  } catch { /* some browsers (e.g. mobile Safari) throw; ignore */ }
}

/* =========================================================
   Sound (Web Audio API — no external files)
   ========================================================= */
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
}

function beep(freq, at, dur, gain = 0.18, type = 'sine') {
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(gain, at + 0.015);   // fast attack
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);   // smooth release
  osc.connect(g).connect(audioCtx.destination);
  osc.start(at);
  osc.stop(at + dur + 0.05);
}

/* Bell timbre: a sine fundamental plus two inharmonic partials.
   Real bells are inharmonic (partials aren't integer multiples of the
   fundamental) — 2.76× and 5.40× are the classic ratios for a struck
   bell and give it that bright, ringing quality. */
function bell(freq, at, dur, gain = 0.15) {
  beep(freq,        at, dur,        gain);
  beep(freq * 2.76, at, dur * 0.7,  gain * 0.4);
  beep(freq * 5.40, at, dur * 0.4,  gain * 0.2);
}

function playChime(kind) {
  if (!settings.soundOn || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const t = audioCtx.currentTime + 0.02;
  if (kind === 'focusEnd') {
    bell(880, t, 0.90);        // A5 — bright, "focus done"
  } else {
    bell(587.33, t, 0.70);     // D5 — lower, "back to work"
  }
}

// Unlock audio on the very first interaction, so later beeps are allowed
// even after the tab has been in the background for 25 minutes.
const unlockOnce = () => {
  unlockAudio();
  window.removeEventListener('pointerdown', unlockOnce);
  window.removeEventListener('keydown', unlockOnce);
};
window.addEventListener('pointerdown', unlockOnce);
window.addEventListener('keydown', unlockOnce);

/* =========================================================
   Controls
   ========================================================= */
function startTimer() {
  if (timer.status === 'running') return;
  unlockAudio();                    // this click is the gesture that unlocks audio
  timer.blockStart = Date.now();
  timer.status = 'running';
  requestNotify(false);
  schedulePhaseEnd();
  render();
}

function pauseTimer() {
  if (timer.status !== 'running') return;
  flushBlock();
  timer.status = 'paused';
  clearTimeout(phaseTimer); phaseTimer = null;
  render();
}

function toggleTimer() {
  timer.status === 'running' ? pauseTimer() : startTimer();
}

function resetTimer() {
  flushBlock();
  timer.status = 'idle';
  timer.phase = 'focus';
  timer.phaseElapsed = 0;
  timer.focusCount = 0;
  clearTimeout(phaseTimer); phaseTimer = null;
  render();
}

/* Exact phase-end timeout — far more accurate than setInterval when
   the tab is backgrounded (Chrome throttles intervals to ~1/min). */
function schedulePhaseEnd() {
  clearTimeout(phaseTimer); phaseTimer = null;
  if (timer.mode !== 'pomodoro' || timer.status !== 'running') return;
  const remaining = Math.max(0, phaseDurationMs() - liveElapsed());
  phaseTimer = setTimeout(() => {
    phaseTimer = null;
    if (timer.status === 'running' && liveElapsed() >= phaseDurationMs()) {
      completePhase();
    } else if (timer.status === 'running') {
      schedulePhaseEnd();                 // safety net
    }
  }, remaining + 30);
}

function completePhase() {
  clearTimeout(phaseTimer); phaseTimer = null;

  const finishedPhase = timer.phase;
  flushBlock();
  timer.phaseElapsed = 0;

  if (finishedPhase === 'focus') {
    timer.focusCount += 1;
    const isLong = timer.focusCount % settings.longBreakEvery === 0;
    timer.phase = isLong ? 'longBreak' : 'break';
    timer.status = settings.autoStartBreak ? 'running' : 'idle';
    playChime('focusEnd');
    fireNotify(
      'Focus complete',
      isLong ? 'Great work — take a long break.' : 'Nice — take a short break.'
    );
  } else {
    timer.phase = 'focus';
    timer.status = settings.autoStartFocus ? 'running' : 'idle';
    playChime('breakEnd');
    fireNotify('Break over', 'Back to focus.');
  }

  if (timer.status === 'running') {
    timer.blockStart = Date.now();
    schedulePhaseEnd();
  }
  render();
}

/* =========================================================
   Tick loop — display is always derived from timestamps,
   never accumulated, so it can't drift.
   ========================================================= */
function tick() {
  if (timer.status === 'running' && timer.mode === 'pomodoro') {
    if (liveElapsed() >= phaseDurationMs()) {
      completePhase();
    }
  }
  renderClock();
}
setInterval(tick, 250);

/* Re-sync immediately when the tab becomes visible after being hidden,
   since background timers may have drifted. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (timer.status === 'running' && timer.mode === 'pomodoro') {
    if (liveElapsed() >= phaseDurationMs()) completePhase();
    else schedulePhaseEnd();
  }
  tick();
});

/* =========================================================
   Period math
   ========================================================= */
const startOfDay   = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1).getTime();
const startOfYear  = d => new Date(d.getFullYear(), 0, 1).getTime();
function startOfWeek(d) {                       // Monday-based
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
  return s.getTime();
}

/** Sum of study time overlapping [from, to). Handles midnight-spanning blocks. */
function totalBetween(from, to) {
  let ms = 0;
  for (const s of sessions) {
    const a = Math.max(s.start, from);
    const b = Math.min(s.end, to);
    if (b > a) ms += b - a;
  }
  return ms;
}

/** Live total for today, including the block currently running. */
function liveTodayTotal() {
  const dayStart = startOfDay(new Date());
  let ms = totalBetween(dayStart, Date.now());
  if (timer.blockStart && timer.phase === 'focus') {
    const a = Math.max(timer.blockStart, dayStart);
    if (Date.now() > a) ms += Date.now() - a;
  }
  return ms;
}

/* =========================================================
   Formatting
   ========================================================= */
function fmtClock(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const mm = String(m).padStart(2, '0');
  const ss = String(s).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function fmtHuman(ms) {
  const min = Math.round(ms / 60000);
  if (min < 1) return '0m';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}

/* =========================================================
   Rendering
   ========================================================= */
function renderClock() {
  if (timer.mode === 'stopwatch') {
    $('clock').textContent = fmtClock(Math.floor(liveElapsed() / 1000));
    $('progressBar').style.width = '0%';
  } else {
    const dur = phaseDurationMs();
    const rem = Math.max(0, dur - liveElapsed());
    $('clock').textContent = fmtClock(Math.ceil(rem / 1000));
    $('progressBar').style.width = `${Math.min(100, (1 - rem / dur) * 100)}%`;
  }
  $('todayTotal').textContent = fmtHuman(liveTodayTotal());
}

function render() {
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === timer.mode));

  $('phaseLabel').textContent = timer.mode === 'stopwatch'
    ? 'Stopwatch'
    : { focus: 'Focus', break: 'Short break', longBreak: 'Long break' }[timer.phase];

  $('btnStart').textContent =
    timer.status === 'running' ? 'Pause' :
    timer.status === 'paused'  ? 'Resume' : 'Start';

  renderClock();
}

function renderStats() {
  const now = new Date();
  const nowMs = now.getTime();

  $('statDay').textContent   = fmtHuman(totalBetween(startOfDay(now), nowMs));
  $('statWeek').textContent  = fmtHuman(totalBetween(startOfWeek(now), nowMs));
  $('statMonth').textContent = fmtHuman(totalBetween(startOfMonth(now), nowMs));
  $('statYear').textContent  = fmtHuman(totalBetween(startOfYear(now), nowMs));

  // --- last 7 days bar chart ---
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const from = d.getTime();
    const to = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    days.push({
      label: d.toLocaleDateString(undefined, { weekday: 'short' }),
      ms: totalBetween(from, Math.min(to, nowMs)),
    });
  }
  const max = Math.max(1, ...days.map(d => d.ms));
  $('chart').innerHTML = days.map(d => `
    <div class="day">
      <div class="day-bar"><div class="fill" style="height:${Math.round(d.ms / max * 100)}%"></div></div>
      <div class="day-label">${d.label}</div>
    </div>`).join('');

  // --- recent sessions ---
  const recent = [...sessions].reverse().slice(0, 12);
  $('recentList').innerHTML = recent.length
    ? recent.map(s => `
        <div class="row">
          <span class="t">${new Date(s.start).toLocaleString()}</span>
          <span class="d">${fmtHuman(s.end - s.start)}</span>
          <button data-del="${s.id}" title="Delete">✕</button>
        </div>`).join('')
    : '<div class="muted">No sessions yet — go study something.</div>';
}

/* =========================================================
   Wiring
   ========================================================= */
// tabs
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach(b =>
      b.classList.toggle('active', b === btn));
    document.querySelectorAll('main section').forEach(sec =>
      sec.hidden = sec.id !== `tab-${btn.dataset.tab}`);
    if (btn.dataset.tab === 'stats') renderStats();
  });
});

// mode switch
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (timer.mode === btn.dataset.mode) return;
    resetTimer();
    timer.mode = btn.dataset.mode;
    render();
  });
});

$('btnStart').addEventListener('click', toggleTimer);
$('btnReset').addEventListener('click', resetTimer);

// delete a session
$('recentList').addEventListener('click', e => {
  const id = e.target.dataset?.del;
  if (!id) return;
  sessions = sessions.filter(s => s.id !== id);
  writeJSON(K_SESSIONS, sessions);
  renderStats();
});

/* =========================================================
   Settings
   ========================================================= */
function syncSettingsInputs() {
  document.querySelectorAll('[data-setting]').forEach(inp => {
    const key = inp.dataset.setting;
    if (inp.type === 'checkbox') inp.checked = settings[key];
    else inp.value = settings[key];
  });
}
document.querySelectorAll('[data-setting]').forEach(inp => {
  const key = inp.dataset.setting;
  inp.addEventListener('change', () => {
    settings[key] = inp.type === 'checkbox' ? inp.checked : Number(inp.value);
    writeJSON(K_SETTINGS, settings);

    // Turning the sound toggle ON plays a short bell to confirm.
    if (key === 'soundOn' && settings.soundOn) {
      unlockAudio();
      if (audioCtx) {
        const t = audioCtx.currentTime + 0.05;
        bell(880, t, 0.50, 0.12);
      }
    }
    resetTimer();
  });
});
syncSettingsInputs();

/* =========================================================
   Export / Import
   ========================================================= */
function dataMsg(text) { $('dataMsg').textContent = text; }

/** Fold the running block into storage, then keep the timer running. */
function flushAndContinue() {
  if (timer.status !== 'running' || timer.blockStart === null) return;
  const end = Date.now();
  if (timer.phase === 'focus') addSession(timer.blockStart, end, timer.mode);
  timer.phaseElapsed += end - timer.blockStart;
  timer.blockStart = end;                 // continue seamlessly, no gap
}

function exportData() {
  flushAndContinue();

  const now = new Date();
  const payload = {
    app: 'study-timer',
    version: 1,
    exportedAt: now.toISOString(),
    settings,
    sessions,
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  a.href = url;
  a.download = `study-timer-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  dataMsg(`Exported ${sessions.length} session${sessions.length === 1 ? '' : 's'}.`);
  render();
}

const isNum = n => typeof n === 'number' && Number.isFinite(n);

function sanitizeSessions(raw) {
  if (!Array.isArray(raw)) return [];
  const out = [];
  for (const s of raw) {
    if (!s || !isNum(s.start) || !isNum(s.end) || s.end <= s.start) continue;
    out.push({
      id: typeof s.id === 'string' && s.id ? s.id : crypto.randomUUID(),
      start: s.start,
      end: s.end,
      mode: s.mode === 'stopwatch' ? 'stopwatch' : 'pomodoro',
    });
  }
  return out;
}

async function importData(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch {
    dataMsg("Import failed — that file isn't valid JSON.");
    return;
  }

  const incoming = sanitizeSessions(Array.isArray(data) ? data : data?.sessions);
  const known = new Set(sessions.map(s => s.id));
  let added = 0, skipped = 0;
  for (const s of incoming) {
    if (known.has(s.id)) { skipped++; continue; }
    known.add(s.id);
    sessions.push(s);
    added++;
  }
  sessions.sort((a, b) => a.start - b.start);
  writeJSON(K_SESSIONS, sessions);

  let settingsNote = '';
  if (!Array.isArray(data) && data && data.settings && typeof data.settings === 'object') {
    settings = { ...DEFAULT_SETTINGS, ...data.settings };
    for (const k of ['focusMin', 'breakMin', 'longBreakMin', 'longBreakEvery']) {
      const v = Math.round(Number(settings[k]));
      settings[k] = Number.isFinite(v) && v > 0 ? v : DEFAULT_SETTINGS[k];
    }
    settings.autoStartBreak = !!settings.autoStartBreak;
    settings.autoStartFocus = !!settings.autoStartFocus;
    settings.soundOn        = settings.soundOn !== false;
    writeJSON(K_SETTINGS, settings);
    syncSettingsInputs();
    resetTimer();                          // matches the "changing a length restarts" rule
    settingsNote = ' Settings restored.';
  }

  renderStats();
  render();
  dataMsg(
    `Imported ${added} session${added === 1 ? '' : 's'}` +
    (skipped ? `, skipped ${skipped} duplicate${skipped === 1 ? '' : 's'}` : '') +
    `.${settingsNote}`
  );
}

$('btnExport').addEventListener('click', exportData);
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';                     // lets you re-pick the same file
  if (file) importData(file);
});

/* =========================================================
   Keyboard & lifecycle
   ========================================================= */
// keyboard: space = start/pause, R = reset
window.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyR')  { e.preventDefault(); resetTimer(); }
});

// don't lose a running block when the window closes
window.addEventListener('beforeunload', flushBlock);

/* =========================================================
   Init
   ========================================================= */
updateNotifyUI();
render();
</script>
</body>
</html>
